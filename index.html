<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto škola Stop MGM Kraljevo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#141317;font-family:'Manrope',system-ui,sans-serif;}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    background:radial-gradient(900px 480px at 50% 32%, rgba(225,27,46,.18) 0%, rgba(20,19,24,0) 62%), #141317;
    animation:fadeOut .5s ease 1.25s forwards;}
  .logo{height:78px;width:auto;display:block;animation:pop .7s cubic-bezier(.2,.8,.2,1) both;}
  .logo-fallback{font-family:'Archivo',sans-serif;font-weight:900;font-size:34px;letter-spacing:-0.03em;color:#fff;animation:pop .7s cubic-bezier(.2,.8,.2,1) both;}
  .logo-fallback span{color:#E11B2E;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;display:block;margin-top:4px;}
  .bar{width:180px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;}
  .bar>i{display:block;height:100%;width:40%;border-radius:99px;background:#E11B2E;animation:load 1.25s ease forwards;}
  .cap{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94);}to{opacity:1;transform:none;}}
  @keyframes load{from{width:0;}to{width:100%;}}
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  @keyframes fadeOut{to{opacity:0;visibility:hidden;}}
</style>
<script>
  setTimeout(function(){ location.replace('./pocetna.html'); }, 1650);
</script>
</head>
<body>
<div class="splash">
  <div class="logo-fallback">STOP <span style="color:#E11B2E;">MGM</span><span>Auto škola · Kraljevo</span></div>
  <div class="bar"><i></i></div>
  <div class="cap">Učitavanje…</div>
</div>
<noscript><a href="./pocetna.html" style="color:#fff;">Uđite na sajt →</a></noscript>
</body>
</html>
